{% if is_paginated %}
<div style="display:flex; justify-content:space-between; align-items:center; margin:0.75rem 0;">
    <span class="muted">Page {{ page_obj.number }} / {{ paginator.num_pages }} ({{ paginator.count }} produit{{ paginator.count|pluralize }})</span>
    <div style="display:flex; gap:0.5rem;">
        {% if page_obj.has_previous %}
            <a class="btn btn-small btn-secondary" href="?page={{ page_obj.previous_page_number }}">← Précédent</a>
        {% endif %}
        {% if page_obj.has_next %}
            <a class="btn btn-small btn-secondary" href="?page={{ page_obj.next_page_number }}">Suivant →</a>
        {% endif %}
    </div>
</div>
{% endif %}
