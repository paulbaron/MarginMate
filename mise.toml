# The project's tools, pinned: `mise install` installs them. The Python
# packages live in pyproject.toml (locked in uv.lock) and are installed by
# `uv sync`; the git hooks in prek.toml are wired by `prek install`. See
# README.md, "Development".
[tools]
# The minor version pyproject.toml's requires-python asks for, and the one
# .python-version names: uv reads that file, and without it uv throws an
# existing .venv away to rebuild it on the Python it finds first (this one) -
# production's .venv, its OCR models included, at the next deploy.
python = "3.11"
uv = "0.12.20"
prek = "0.5.4"

[settings]
# Off, and said so (a user's global config could turn it on): it exports
# UV_PYTHON as the exact Python mise installed (3.11.16) into every uv a shim
# runs - deploy.cmd's `uv sync`, prek's `uv run` - which beats .python-version,
# and uv then replaces a .venv made on any other 3.11. On 01/10/2026 a `uv run`
# began deleting the development folder's .venv that way.
python.uv_venv_auto = false

[env]
# What uv_venv_auto did that is worth keeping, without its UV_PYTHON: the
# `python` and `pip` shims run .venv's in this folder (`python manage.py …`).
_.python.venv = { path = ".venv" }
