{% comment %}
The file « Tester » reads with the format as typed (views.TEST_FILE): read,
never kept. Inside the format's form, which posts multipart.
{% endcomment %}
<div class="form-grid">
    <div class="form-field form-field-file">
        <label for="id_fichier_essai">Tester sur un fichier</label>
        <input type="file" name="fichier_essai" id="id_fichier_essai" accept=".csv,text/csv">
        <p class="help">Un relevé exporté en CSV : lu avec le format ci-dessus, jamais gardé.</p>
    </div>
</div>
